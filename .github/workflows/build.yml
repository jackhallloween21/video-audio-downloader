name: Build Windows EXE

on:
  push:
    tags: ["v*"]          # e.g. git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:       # or run manually from the Actions tab

permissions:
  contents: write          # needed to attach the .exe to a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE (windowed = no terminal, with icon)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "YT-Downloader"
          --icon "assets/icon.ico"
          --add-data "assets;assets"
          --collect-all customtkinter
          ytdl_gui.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-windows
          path: dist/YT-Downloader.exe

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YT-Downloader.exe
          generate_release_notes: true
